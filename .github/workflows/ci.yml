name: Website CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test node statistics updater
        run: PYTHONPATH=scripts python3 -B -m unittest discover -s scripts/tests
      - name: Build production container
        run: docker build --tag montanamesh-site:ci .
